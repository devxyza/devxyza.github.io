<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>808 Randomizer Pad</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --pad-color: #1a1a1d;
            --accent-color: #3b82f6;
            --text-main: #e2e8f0;
            --text-dim: #64748b;
            --border: #2d2d33;
        }

        body, html {
            height: 100%; margin: 0; 
            background-color: var(--bg-color);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-main);
        }

        .drum-machine { 
            background: var(--pad-color); 
            padding: 32px; 
            border-radius: 24px; 
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px; 
        }

        button {
            width: 110px; height: 110px; 
            border: 1px solid var(--border);
            border-radius: 16px;
            font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.1s ease;
            color: var(--text-main);
            background: linear-gradient(145deg, #222226, #161619);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        button:active { 
            transform: scale(0.96); 
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .label { 
            display: block; font-size: 9px; margin-top: 6px; 
            color: var(--text-dim); font-weight: 400;
        }

        /* Status & Logs Section */
        #status-container {
            margin-top: 24px;
            width: 488px;
        }

        #log-header {
            font-size: 11px; color: var(--text-dim);
            margin-bottom: 8px; text-transform: uppercase;
            letter-spacing: 1px; display: flex; justify-content: space-between;
        }

        #logs {
            height: 80px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            overflow-y: auto;
            font-size: 12px; line-height: 1.6;
            color: var(--text-main);
            scrollbar-width: thin;
        }

        .log-entry { border-bottom: 1px solid rgba(255,255,255,0.02); padding: 2px 0; }
        .log-error { color: #f87171; }
        .log-success { color: #34d399; }
    </style>
</head>
<body>

<div class="drum-machine">
    <div class="grid">
        <button onclick="playRandom('kick')">Kick <span class="label">1-16</span></button>
        <button onclick="playRandom('snare')">Snare <span class="label">1-16</span></button>
        <button onclick="playRandom('hatC')">C-Hat <span class="label">1-5</span></button>
        <button onclick="playRandom('hatO')">O-Hat <span class="label">1-3</span></button>

        <button onclick="playRandom('clap')">Clap <span class="label">1-2</span></button>
        <button onclick="playRandom('tom')">Tom <span class="label">1-7</span></button>
        <button onclick="playRandom('ride')">Ride <span class="label">1-4</span></button>
        <button onclick="playRandom('shaker')">Shaker <span class="label">1-2</span></button>
    </div>
</div>

<div id="status-container">
    <div id="log-header">
        <span>System Status</span>
        <span id="load-count">Initializing...</span>
    </div>
    <div id="logs"></div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const cache = {};
    const masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
    masterGain.gain.value = 0.8;

    const logEl = document.getElementById('logs');
    const countEl = document.getElementById('load-count');

    function addLog(msg, type = '') {
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.textContent = msg;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    const library = {
        kick: Array.from({length: 16}, (_, i) => `Kick${(i+1).toString().padStart(2, '0')}.wav`),
        snare: Array.from({length: 16}, (_, i) => `Snare${(i+1).toString().padStart(2, '0')}.wav`),
        hatC: Array.from({length: 5}, (_, i) => `Hat_C${(i+1).toString().padStart(2, '0')}.wav`),
        hatO: Array.from({length: 3}, (_, i) => `Hat_O${(i+1).toString().padStart(2, '0')}.wav`),
        clap: ['Clap01.wav', 'Clap02.wav'],
        tom: Array.from({length: 7}, (_, i) => `Tom${(i+1).toString().padStart(2, '0')}.wav`),
        ride: Array.from({length: 4}, (_, i) => `Ride${(i+1).toString().padStart(2, '0')}.wav`),
        shaker: ['Shaker01.wav', 'Shaker02.wav']
    };

    async function preloadAll() {
        const allFiles = Object.values(library).flat();
        let loaded = 0;
        
        addLog("Syncing sample library...");

        const promises = allFiles.map(async (file) => {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error();
                const buffer = await response.arrayBuffer();
                cache[file] = await audioCtx.decodeAudioData(buffer);
                loaded++;
                countEl.textContent = `${loaded}/${allFiles.length} Loaded`;
            } catch (e) {
                addLog(`Missing: ${file}`, 'log-error');
            }
        });

        await Promise.all(promises);
        addLog("System ready. All triggers active.", 'log-success');
    }

    function playRandom(category) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const files = library[category];
        const randomFile = files[Math.floor(Math.random() * files.length)];

        if (!cache[randomFile]) return;

        const source = audioCtx.createBufferSource();
        source.buffer = cache[randomFile];
        source.connect(masterGain);
        source.start(audioCtx.currentTime);
    }

    // Start loading
    preloadAll();
</script>

</body>
</html>
